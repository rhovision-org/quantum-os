name: QOS browser init acceptance (#284)
on:
  pull_request:
    paths:
      - "packages/browser/src/qos-*.ts"
      - "packages/browser/src/app.ts"
      - "packages/browser/src/palette.ts"
      - "packages/browser/test/qos-init-opfs-ci.mjs"
      - "scripts/localnet/qos-vfs-opfs-ci.py"
      - ".github/workflows/qos-init-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-init:
    name: Chromium signed packages and deterministic init reload
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm build:wasm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:signaling
      - name: Install disposable Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/qos284-playwright" --no-save --no-package-lock playwright@1.65.1
          "$RUNNER_TEMP/qos284-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Actual browser package and service operations
        env:
          QOS_PLAYWRIGHT_MODULE: ${{ runner.temp }}/qos284-playwright/node_modules/playwright/index.mjs
        run: python3 scripts/localnet/qos-vfs-opfs-ci.py init
      - name: Upload verified browser evidence
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: qos284-browser-init
          path: |
            qos284-opfs-evidence.json
            qos284-opfs-evidence.SHA256SUMS
          if-no-files-found: error
