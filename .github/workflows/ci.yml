name: CI

on:
  push:
    # `work` is where changes land first; `main` is what is deployed. Both are
    # checked, so a merge to main is never the first time anything is run.
    branches: [main, work]
  pull_request:
    branches: [main, work]

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Run tests
        run: cargo test --workspace

  wasm:
    name: WASM build + TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Build WASM kernel
        run: pnpm build:wasm

      - name: Install JS dependencies
        run: pnpm install

      - name: Build signaling server
        run: pnpm build:signaling

      - name: Typecheck browser
        run: pnpm --filter @quantum-os/browser typecheck

      # The macro language is plain JS so it runs under node with no build,
      # which is the whole reason it is plain JS: its tests are the only ones
      # covering the two lexers and the expander.
      - name: Macro language selftest
        run: node packages/browser/src/macro-lang.js --selftest

      - name: Capability macro selftest
        run: node scripts/qos-cli/rholang-macros.mjs --selftest

      # The faucet's HTTP face (faucet-http.mjs) against a stub send — the
      # per-address cooldown, the per-client hourly cap, X-Forwarded-For as
      # the client, the JSON/CORS shape a wallet codes against. Dependency-
      # free, so it runs here without scripts/qos-cli's npm install.
      - name: Faucet HTTP selftest
        run: node scripts/qos-cli/faucet-http.selftest.mjs

      - name: Locker selftest
        run: node packages/browser/src/locker.js --selftest

      # rgov's argument-substitution convention (rgov-apply.js) — the one
      # r-wallet's snippet_apply implements and scripts/localnet/rgov-check.mjs
      # audits against. Pure string work, so it runs here; the audit itself
      # needs a live node and does not.
      - name: rgov substitution selftest
        run: node packages/browser/src/rgov-apply.js --selftest

      # The three governance contracts (Inbox, Group, Issue). Checks the half
      # that ships: sources well-formed, the invariants the design rests on
      # (one state cell, the Nil identity guard, privilege as data rather than
      # the installer's capability, a read facet that answers no message body),
      # and call sites that cannot carry an argument out of position. The live
      # half is scripts/localnet/rgov-core-check.mjs, which needs a chain.
      - name: rgov core contracts selftest
        run: node packages/browser/src/rgov-core.js --selftest

      # The redesigned master dictionary (MasterDictionary.md). Checks the
      # shape rules the design rests on — names rooted in the caller's derived
      # identity, append-only versions, revocable grants, a governed alias tier,
      # and a bad arity that answers. The live half is
      # scripts/localnet/dictionary-check.mjs, which needs a chain.
      - name: Master dictionary selftest
        run: node packages/browser/src/dictionary.js --selftest

      # The room key and hashed room id (room-crypto.js) — the one file the
      # browser and the Node agents both run, so one derivation, not two.
      - name: Room crypto selftest
        run: node packages/browser/src/room-crypto.js --selftest

      # The signaling server over real sockets: the `data` relay and its
      # sender check, the seat held through a lost socket, the silent resume
      # with replay, departure only on grace expiry or an explicit leave.
      - name: Signaling server test
        run: node --test packages/signaling/test/server.test.mjs

      # The pooled token exchange contract (open/provide/swap/… + the atomic
      # cross-shard 2PC verbs) and its `$x*` macro call-site shape. Shape
      # only; live-node behaviour is verified manually against localnet.
      - name: Exchange selftest
        run: node packages/browser/src/rholang-exchange.js --selftest

      # The wrapped-native-token contract + $wrap/$unwrap/$wrelease macro
      # call-site shape. Same scope as the exchange selftest above.
      - name: Wrapped token selftest
        run: node packages/browser/src/wrapped-token.js --selftest

      # The cross-shard trade recovery decision table (exchange-2pc.ts) —
      # pure, so this is exhaustive over every reachable (local, remote)
      # status pair, not shape-only.
      - name: Exchange 2PC recovery test
        run: node packages/browser/test/exchange-2pc.test.mjs

      # Browser behaviour, against stubbed media. Not a rendering test — it
      # asserts which track ends up in the stream a joiner would be given.
      - name: Calls test
        run: node packages/browser/test/calls.test.mjs

      # The browser peer against a stubbed clock, socket and RTCPeerConnection:
      # the retry sweep (wrong twice from live rooms), and the relayed control
      # plane — sealed frames, in-order queueing through a socket blip,
      # onPeerReady on a fresh join but not a resume, a dead data channel not
      # being a departure.
      - name: Peer transport test
        run: node packages/browser/test/peer.test.mjs

      # The posix-net socket macro layer (connect/listen/accept/send/close),
      # against a fake two-peer mesh — no WebRTC or QOSPeer involved, since
      # posix-net.ts only ever talks to the injected SocketTransport interface.
      - name: POSIX-net socket test
        run: node packages/browser/test/posix-net.test.mjs

      # Every /gov subcommand findable in Governance.md, and the chain family
      # present in the room agent's own knowledge. Both regressions happened:
      # /gov claim shipped documented nowhere (and it is the recovery path for
      # somebody locked out of their own group), and /gov chain shipped without
      # reaching askKnowledge, so /facil ask denied it existed. Caught by a
      # person both times.
      - name: Gov commands are documented
        run: node packages/browser/test/gov-docs.test.mjs

      # The local /search + /solve enumerator (#119) — possibilities/events
      # shapes, the listener rollups, the /solve cascade, and a conformance
      # block of digests captured from quantum-logical-framework's
      # qucalc_search.py so the TS port cannot silently drift.
      - name: QuCalc search test
        run: node packages/browser/test/qucalc-search.test.mjs

      # Tier-2 rnode room members (#138): a single node stays inconclusive;
      # identical inputs may agree; same-input post-state/result divergence is
      # explicit falsifier evidence. Pure decision logic, no live rnode needed.
      - name: Rholang multi-rnode probe test
        run: node packages/browser/test/rholang-probe.test.mjs

      # /channel chain (#78): reading the Channel contract's answers back out of
      # rendered text, post-text decoding, and channel naming.
      - name: Chain channel test
        run: node packages/browser/test/chain-channel.test.mjs
      # What a node's answers render to, and a deploy that failed on chain kept
      # apart from one that answered (classifyDeployStatus).
      - name: Render expr test
        run: node packages/browser/test/render-expr.test.mjs

  docs:
    name: Document network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The docs are a network with README.md as its hub (quantum-os#116). This
      # fails on an orphaned root/docs .md, a dead relative link, or a #anchor
      # that names no heading — seconds, no dependencies.
      - name: Check the document network
        run: python3 scripts/doc_network_check.py
