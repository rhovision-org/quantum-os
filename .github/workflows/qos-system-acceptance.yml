name: QOS/1 integrated system acceptance (#276)
on:
  push:
    branches: [feat/qos1-system-acceptance-276]
  pull_request:
    branches: [main, work, feat/qos-native-boot-286]
    paths:
      - "packages/browser/src/qos-*.ts"
      - "packages/browser/src/app.ts"
      - "packages/browser/src/zfa.ts"
      - "scripts/qos-cli/**"
      - "scripts/localnet/qos-memory-ci.py"
      - "bin/rnode"
      - "packages/browser/src/palette.ts"
      - "packages/browser/test/qos-system-opfs-ci.mjs"
      - "scripts/localnet/qos-vfs-opfs-ci.py"
      - ".github/workflows/qos-system-acceptance.yml"
permissions:
  contents: read
jobs:
  cross-runtime:
    name: "Single journal: shell, device, recovery and native boot"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm build:wasm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:signaling
      - name: Install disposable Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/qos276-playwright" --no-save --no-package-lock playwright@1.65.1
          "$RUNNER_TEMP/qos276-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Install existing headless peer dependencies
        run: npm install --prefix scripts/qos-cli --ignore-scripts --no-package-lock
      - name: Actual browser and Node boot witness
        env:
          QOS_PLAYWRIGHT_MODULE: ${{ runner.temp }}/qos276-playwright/node_modules/playwright/index.mjs
        run: python3 scripts/localnet/qos-vfs-opfs-ci.py system
      - name: Upload verified browser evidence
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: qos276-cross-runtime
          path: |
            qos276-opfs-evidence.json
            qos276-opfs-evidence.SHA256SUMS
          if-no-files-found: error

  durability:
    name: Disposable Rholo durability (${{ matrix.kind }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: memory
            issue: 279
          - kind: vfs
            issue: 280
          - kind: device
            issue: 283
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm build:wasm
      - run: pnpm install --frozen-lockfile
      - name: Real VFS publication and independent recovery
        run: python3 scripts/localnet/qos-memory-ci.py ${{ matrix.kind }}
      - name: Upload verified evidence
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: integrated-rholo-${{ matrix.kind }}
          path: |
            qos${{ matrix.issue }}-rholo-evidence.json
            qos${{ matrix.issue }}-rholo-evidence.SHA256SUMS
          if-no-files-found: error
